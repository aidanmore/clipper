name: Verify direct browser exports
on:
  push:
    branches: [main, direct-clip-downloads]
    paths: ['app.js', 'direct-export.js', 'encode-worker.js', 'vendor/**', 'tests/**', '.github/workflows/clipper-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio and browser checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Check selection and server-side helpers
        run: |
          node --check app.js
          node --check direct-export.js
          node --check encode-worker.js
          node --test tests/core.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify real MP3 and WAV downloads in Chromium and WebKit
        run: python -u tests/browser_export.py
