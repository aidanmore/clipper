name: Prepare clipper archive
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/clipper-archive.yml']
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clipper-archive
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/prepare_archive.py --limit 4
      - name: Save generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh clipper archive data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
