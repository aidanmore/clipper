name: Export clipper audio
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
concurrency:
  group: clipper-export-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  export:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[clipper export]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/export_request.py
        env:
          GH_TOKEN: ${{ github.token }}
